<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Умный поиск · Store.softline (демо на фикстуре)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1>Умный поиск <small style="font-size:13px;color:#6b7280;">демо · фикстура, домены .invalid</small></h1>

    <form id="search-form" class="search-line">
      <input id="search-input" type="search" placeholder="Например: сервер" autocomplete="off" autofocus>
      <button type="submit">Найти</button>
    </form>

    <div class="demo-chips" id="demo-chips">
      <button type="button" data-demo-query="сервер">сервер (основная фикстура)</button>
      <button type="button" data-demo-query="мало">мало (shortfall)</button>
      <button type="button" data-demo-query="нет совпадений">нет совпадений (нет прямых)</button>
      <button type="button" data-demo-query="дополнение">дополнение (complement + альтернатива)</button>
      <button type="button" data-demo-query="ошибка сервера">ошибка сервера (сбой)</button>
    </div>

    <div id="state-box" aria-live="polite"></div>
  </main>

  <script src="api-config.js"></script>
  <script src="api.js"></script>
  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
